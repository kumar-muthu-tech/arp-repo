services:
  ap-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: ap-site:latest
    container_name: ap-site
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
